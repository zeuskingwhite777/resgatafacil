<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resgate Fácil - Portal de Transações</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding-top: 15vh;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 24px;
            color: #00ff66;
            margin-bottom: 10px;
        }
        p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #00ff66;
            color: #000;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Resgate Fácil</h1>
        <p>Infraestrutura segura para resgates e transações digitais.</p>
        <button class="btn" onclick="alert('Sistema online e operacional!')">Acessar Painel</button>
    </div>
</body>
</html>
